<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Só o que precisa existir antes do React montar. Canonical, og:*, twitter:*
      e JSON-LD são responsabilidade do componente Seo (src/components/Seo.tsx),
      que os define por rota e com a URL absoluta correta.

      Declarar esses mesmos campos aqui criava DUAS tags de cada — a estática,
      com valor genérico e `og:url` relativo ("/"), e a do componente. Canonical
      duplicado faz o Google descartar o sinal.
    -->
    <title>TRIPSMART — Roteiros inteligentes em Pernambuco com IA</title>
    <meta name="author" content="TRIPSMART" />
    <meta property="og:site_name" content="TRIPSMART" />
  </head>

  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // Contraparte de public/404.html: desfaz a codificação da URL e devolve
      // o caminho pedido ao formato normal antes do React Router ler
      // `location` — precisa rodar antes do módulo abaixo.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
