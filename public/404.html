<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>TRIPSMART</title>
    <script type="text/javascript">
      // GitHub Pages não tem redirecionamento do lado do servidor — qualquer
      // caminho que não seja a raiz (ex: /perfil) cai aqui, porque é isso que
      // o GitHub Pages serve para tudo que não é um arquivo real no build.
      //
      // Reescreve o caminho pedido como query string e manda pro index.html,
      // que devolve pro formato normal (via history.replaceState, ver o
      // script equivalente em index.html) antes do React Router montar.
      //
      // Truque padrão da comunidade para SPA em GitHub Pages:
      // https://github.com/rafgraph/spa-github-pages
      //
      // 1 porque hoje é servido em silva5875.github.io/TRIPSMART/ (o nome do
      // repositório entra no caminho). Trocar para 0 — e `base: '/'` em
      // vite.config.ts — quando o domínio próprio (www.tripsmart.com) entrar.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
